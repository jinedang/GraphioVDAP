<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Graphio VDAP 웹앱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* VOICE: 실제 출시된 업무용 제품 화면. 차분하고 조밀한 작업 도구.
   IDEA: VDAP 사용자 콘솔. 상단 6개 탭, 왼쪽 세부 메뉴, 오른쪽 작업 영역.
   PICTURE: 작업 화면 자체(앱 카드, 승인함, 생성된 주간보고, 막대 차트).
   COLOUR/TYPE: 기존 VDAP 프로토타입 토큰(파랑 #1F5FD1, Studio 초록, 외부 데이터 호박색), IBM Plex Sans KR.
   LAYOUT: 고정 헤더 + 232px 사이드바 + 본문. 860px 아래에서는 사이드바가 가로 칩 줄로 바뀜. */
:root{
  color-scheme:light;
  --bg:#F4F5F7;--surface:#FFFFFF;--ink:#16181D;--ink-2:#3A424C;--muted:#58616C;
  --line:#DDE1E7;--line-strong:#B8BEC7;
  --accent:#1F5FD1;--accent-ink:#174AA6;--accent-soft:#E8EFFB;--on-accent:#FFFFFF;
  --ok-bg:#E3F3EA;--ok:#176B40;--idle-bg:#ECEEF1;--idle:#3A424C;
  --busy-bg:#FBF0DC;--busy:#7A4A00;--bad-bg:#FBE9E7;--bad:#A1241C;
  --studio:#1F7A4D;--studio-soft:#E2F3EA;--studio-line:#58B487;
  --ext:#8A5300;--ext-soft:#FCF1DE;--ext-line:#E0A54A;
  --shadow:0 8px 24px rgba(16,19,24,.12);
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --hdr:61px;
}
:root[data-mode=dark]{
  color-scheme:dark;
  --bg:#101318;--surface:#191D24;--ink:#E6E9EE;--ink-2:#C3C9D2;--muted:#9AA3AF;
  --line:#2C333D;--line-strong:#46505C;
  --accent:#5B8FEA;--accent-ink:#8FB3F2;--accent-soft:#1C2A42;--on-accent:#0E1420;
  --ok-bg:#15301F;--ok:#7FD3A1;--idle-bg:#232932;--idle:#C3C9D2;
  --busy-bg:#33270F;--busy:#F0C36D;--bad-bg:#3A1A18;--bad:#F09A92;
  --studio:#6FD09D;--studio-soft:#142A1E;--studio-line:#3E8C64;
  --ext:#F0C36D;--ext-soft:#2E2410;--ext-line:#8A6420;
  --shadow:0 8px 24px rgba(0,0,0,.45);
}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-size:.9em}
.muted{color:var(--muted)}
h1{font-size:24px;line-height:1.25;margin:0;font-weight:700;text-wrap:balance}
h2{font-size:16px;margin:0;font-weight:700}
h3{font-size:15px;margin:0;font-weight:600}
p{margin:0}

/* 헤더 */
.top{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:8px;padding:8px max(16px,2vw);min-height:60px}
.logo{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:18px;letter-spacing:-.01em;text-decoration:none;color:var(--ink);white-space:nowrap;padding:6px 10px 6px 0;margin-right:6px}
.logo img{width:30px;height:auto;display:block}
.tabs{display:flex;gap:2px;overflow-x:auto;flex:1 1 auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{display:inline-flex;align-items:center;gap:6px;padding:0 14px;min-height:44px;border-radius:8px;color:var(--ink-2);text-decoration:none;white-space:nowrap;flex:none}
.tabs a:hover{background:var(--bg)}
.tabs a.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.tabs a small{font-size:11px;font-weight:500;color:var(--muted)}
.tabs a.on small{color:var(--accent-ink)}
.right{display:flex;gap:8px;align-items:center;margin-left:auto;flex:none}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:0 12px;min-height:40px;color:var(--ink-2)}
.seg button.on{background:var(--ink);color:var(--surface);font-weight:600}
.who{display:inline-flex;flex-direction:column;line-height:1.2;text-align:right;font-weight:600;font-size:14px}
.who small{font-weight:500;font-size:12px;color:var(--muted)}
@media(max-width:860px){.top-in{flex-wrap:wrap}.tabs{order:3;flex-basis:100%}}

/* 공통 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:0 14px;min-height:40px;font-weight:600;color:var(--ink);white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--ink-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.st{background:var(--studio);border-color:var(--studio);color:var(--surface)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:none}
.btn.sm{min-height:32px;padding:0 10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.cnt{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;background:var(--bad);color:#fff;font-size:11.5px;font-weight:700;line-height:18px;text-align:center}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.sb{justify-content:space-between}

/* 셸 */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);max-width:1480px;margin:0 auto}
.side{position:sticky;top:var(--hdr);align-self:start;max-height:calc(100vh - var(--hdr));overflow:auto;padding:18px 12px 40px;border-right:1px solid var(--line);display:grid;gap:2px}
.side h4{margin:14px 12px 4px;font-size:12px;font-weight:600;color:var(--muted)}
.side h4:first-child{margin-top:0}
.side a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 12px;min-height:42px;border-radius:8px;color:var(--ink-2);text-decoration:none}
.side a:hover{background:var(--surface)}
.side a.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.side.studio a.on{background:var(--studio-soft);color:var(--studio)}
.side .n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.side .n.hot{background:var(--bad);color:#fff;border-radius:999px;padding:0 7px;font-weight:700}
main{padding:24px clamp(16px,3vw,36px) 72px;display:grid;gap:22px;align-content:start}
@media(max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line);display:flex;overflow-x:auto;padding:8px 12px;gap:4px;background:var(--surface)}
  .side h4{display:none}.side a{flex:none;min-height:38px}
}
.ph{display:flex;gap:12px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.ph p{margin-top:4px;color:var(--muted)}
.sec{display:grid;gap:12px;align-content:start}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:10px;align-content:start}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr))}
.grid.sm{grid-template-columns:repeat(auto-fill,minmax(min(100%,180px),1fr))}
.split{display:grid;gap:18px;grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
.split.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media(max-width:1000px){.split,.split.even{grid-template-columns:minmax(0,1fr)}}
.note{border-left:3px solid var(--accent);background:var(--accent-soft);color:var(--ink);padding:10px 14px;border-radius:0 8px 8px 0}
.note.st{border-color:var(--studio);background:var(--studio-soft)}
.note.ext{border-color:var(--ext-line);background:var(--ext-soft)}
.note.warn{border-color:var(--bad);background:var(--bad-bg)}
.empty{border:1.5px dashed var(--line-strong);border-radius:12px;padding:24px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}
.sample{font-size:12.5px;color:var(--muted)}

/* 배지·태그 */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b-ok{background:var(--ok-bg);color:var(--ok)}.b-idle{background:var(--idle-bg);color:var(--idle)}
.b-busy{background:var(--busy-bg);color:var(--busy)}.b-bad{background:var(--bad-bg);color:var(--bad)}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:6px;background:var(--bg);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.tag.int{background:var(--studio-soft);border-color:var(--studio-line);color:var(--studio);font-weight:600}
.tag.ext{background:var(--ext-soft);border-color:var(--ext-line);color:var(--ext);font-weight:600}
.tag.pub{border-color:var(--accent);color:var(--accent-ink)}

/* 앱 카드 */
.appc .top2{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.appc .name{font-weight:600;font-size:15.5px}
.url{font-family:var(--mono);font-size:12.5px;color:var(--muted);word-break:break-all}
.meta{display:flex;gap:6px;flex-wrap:wrap}

/* 리스트 */
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;display:grid}
.li{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.li:last-child{border-bottom:0}
.li .main{display:grid;gap:2px;flex:1 1 240px}
.li .main b{font-weight:600}

/* 표 */
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12.5px;color:var(--muted);font-weight:600;background:var(--bg);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td .btn+.btn{margin-left:4px}

/* 입력 */
.field{display:grid;gap:6px;align-content:start}
.field>label,.field>.lb{font-weight:600;font-size:13.5px}
.help{font-size:13px;color:var(--muted)}
.err{font-size:13px;color:var(--bad)}
.inp{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:8px 12px;min-height:44px;width:100%;font-size:16px}
textarea.inp{min-height:92px;resize:vertical;line-height:1.5}
select.inp{padding-right:28px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opts label{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line-strong);border-radius:8px;padding:0 12px;min-height:44px;background:var(--surface);cursor:pointer}
.opts label:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.opts label.dis{opacity:.5;cursor:not-allowed}
.form{display:grid;gap:16px;max-width:760px}
.inline{display:grid;gap:8px;grid-template-columns:minmax(0,1fr) auto auto}
@media(max-width:600px){.inline{grid-template-columns:minmax(0,1fr)}}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:0 12px;min-height:36px;color:var(--ink-2)}
.chips button.on{background:var(--ink);border-color:var(--ink);color:var(--surface);font-weight:600}

/* 타일·차트 */
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:2px}
.tile .v{font-size:clamp(20px,2.4vw,26px);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.tile .k{font-size:13px;color:var(--muted)}
.tile .d{font-size:12.5px;font-weight:600}
.up{color:var(--ok)}.down{color:var(--bad)}
.hbars{display:grid;gap:8px}
.hbar{display:grid;grid-template-columns:88px minmax(0,1fr) 70px;gap:10px;align-items:center;font-size:13.5px}
.hbar .v{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.track{height:12px;background:var(--idle-bg);border-radius:999px;overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);border-radius:999px}
.track.st i{background:var(--studio)}
.vbars{display:flex;align-items:flex-end;gap:6px;padding:12px 10px 8px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.vbars .col{flex:1;display:grid;justify-items:center;gap:6px}
.vbars .pair{display:flex;gap:2px;align-items:flex-end;height:150px}
.vbars .pair i{display:block;width:12px;border-radius:3px 3px 0 0}
.vbars i.a{background:var(--accent)}.vbars i.t{background:var(--line-strong)}
.vbars span{font-size:12px;color:var(--muted);white-space:nowrap}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.meter{height:8px;background:var(--idle-bg);border-radius:999px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);transition:width .5s ease}
.code{font-family:var(--mono);font-size:12.5px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;white-space:pre-wrap;word-break:break-word;margin:0}

/* 만들고 싶은 앱 */
.wcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px;align-content:start}
.wcard.int{border-top:3px solid var(--studio)}
.wcard.ext{border-top:3px solid var(--ext-line)}
.wcard b{font-size:15px}
.stage{border:1px solid var(--line-strong);background:var(--surface);border-radius:6px;padding:2px 6px;min-height:32px;font-size:13px}

/* 메모 */
.memo{display:grid;gap:10px}
.mitem{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:6px}
.mitem.pin{border-color:var(--ext-line);background:var(--ext-soft)}
.mitem p{white-space:pre-wrap;word-break:break-word}

/* Studio 결과 문서 */
.doc{background:var(--surface);border:1px solid var(--studio-line);border-radius:12px;padding:clamp(16px,3vw,28px);display:grid;gap:18px}
.doc header{display:grid;gap:4px;border-bottom:1px solid var(--line);padding-bottom:14px}
.doc header .tag{justify-self:start}
.doc h2{font-size:20px}
.doc h3{font-size:15px;color:var(--studio)}
.doc ul{margin:0;padding-left:20px;display:grid;gap:4px}
.doc footer{border-top:1px solid var(--line);padding-top:12px;font-size:13px;color:var(--muted)}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps span{font-size:12.5px;padding:2px 10px;border-radius:999px;background:var(--idle-bg);color:var(--muted)}
.steps span.done{background:var(--studio-soft);color:var(--studio);font-weight:600}
.steps span.run{background:var(--busy-bg);color:var(--busy);font-weight:600}

/* 모달·토스트 */
.scrim{position:fixed;inset:0;background:rgba(10,12,16,.5);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);width:min(520px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:22px;display:grid;gap:14px}
.modal.wide{width:min(720px,100%)}
.acct{display:grid;gap:8px}
.acct button{display:grid;gap:2px;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px}
.acct button:hover{border-color:var(--accent)}
.acct button span{font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.foot{font-size:12.5px;color:var(--muted);padding:0 clamp(16px,3vw,36px) 28px}
@media(max-width:600px){
  table{font-size:13px}
  .stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}
  .stack td{display:flow-root;border:0;padding:3px 14px;padding-inline-start:calc(14px + 7.5em);text-align:start}
  .stack td::before{content:attr(data-l);float:inline-start;width:7em;margin-inline-start:-7.5em;color:var(--muted);font-size:12px}
  .stack td:empty{display:none}
  .hbar{grid-template-columns:64px minmax(0,1fr) 58px}
  .vbars .pair i{width:7px}
  .right .who{display:none}
}
.side a.ind{padding-left:30px;font-size:14px;min-height:38px}
.lr-wrap{max-width:820px;width:100%;margin:0 auto;display:grid;gap:18px}
.srcseg{display:flex;gap:8px;flex-wrap:wrap}
.srcseg button{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;min-height:44px;padding:0 16px;font-weight:600;color:var(--ink)}
.srcseg button.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.dropz{border:1.5px dashed var(--line-strong);border-radius:10px;padding:34px 16px;text-align:center;display:grid;gap:6px;justify-items:center;cursor:pointer;background:var(--surface)}
.dropz svg{width:38px;height:38px;color:var(--ink-2)}
.dropz:hover,.dropz.over{border-color:var(--accent);background:var(--accent-soft)}
.studio-grid{display:grid;gap:18px;grid-template-columns:minmax(0,1fr) 300px;align-items:start}
@media(max-width:1100px){.studio-grid{grid-template-columns:minmax(0,1fr)}}
.composer{border:1.5px solid var(--studio-line);background:var(--surface);border-radius:14px;padding:16px 18px;display:grid;gap:12px}
.composer:focus-within{box-shadow:0 0 0 4px var(--studio-soft)}
.cmp-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cmp-top .sel{width:auto;min-height:38px;font-size:14px;padding:4px 28px 4px 10px}
.llm{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--studio);background:var(--studio-soft);border-radius:999px;padding:4px 12px}
.llm::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--studio)}
.prompt{border:0;background:transparent;width:100%;min-height:104px;font-size:17px;line-height:1.55;resize:vertical;padding:4px 2px;color:var(--ink)}
.prompt:focus-visible{outline:none}
.cmp-row{display:grid;grid-template-columns:52px minmax(0,1fr);gap:8px;align-items:start}
.cmp-row .lb{font-size:13px;font-weight:600;color:var(--muted);padding-top:7px}
@media(max-width:600px){.cmp-row{grid-template-columns:minmax(0,1fr)}}
.sk-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--studio-line);background:var(--studio-soft);color:var(--studio);border-radius:999px;padding:0 2px 0 10px;min-height:32px;font-size:13px;font-weight:600;font-family:var(--mono)}
.sk-chip em{font-style:normal;font-family:var(--sans);font-size:11px;opacity:.8}
.sk-chip.guide{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.sk-chip button{border:0;background:none;color:inherit;width:28px;height:28px;border-radius:50%;font-size:16px;line-height:1}
.sk-chip button:hover{background:rgba(0,0,0,.08)}
.chips button[disabled]{opacity:.45;cursor:not-allowed}
.picker{border:1px solid var(--line);border-radius:10px;display:grid;max-height:300px;overflow:auto;margin-left:60px}
@media(max-width:600px){.picker{margin-left:0}}
.picker label{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center}
.picker label:last-child{border-bottom:0}
.picker label>span{grid-column:2;font-size:13px;color:var(--muted)}
.picker .mono{font-weight:400;color:var(--muted);font-size:12px}
.kv{display:grid;grid-template-columns:44px minmax(0,1fr);gap:6px 10px;margin:0;font-size:14px}.kv dt{color:var(--muted)}.kv dd{margin:0}
.turns{display:grid;gap:6px}
.turn{font-size:14px;background:var(--studio-soft);border-radius:8px;padding:8px 12px}
.turn b{color:var(--studio);margin-right:6px}
.rtabs{display:flex;gap:2px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.rtabs button{border:0;background:none;padding:0 14px;min-height:42px;border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--ink-2)}
.rtabs button.on{color:var(--studio);border-bottom-color:var(--studio);font-weight:600}
.checks{margin:4px 0 0;padding-left:18px;font-size:13.5px;color:var(--ink-2)}
.sw{width:18px;height:18px;accent-color:var(--studio)}
#auth{display:none}
body.pre #auth{display:block}
body.pre .top,body.pre .shell,body.pre .foot{display:none}
.auth{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto;padding:18px max(16px,4vw)}
.auth-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.auth-mid{display:grid;justify-items:center;align-content:center;gap:16px;padding:28px 0}
.auth-card{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:clamp(20px,4vw,32px);display:grid;gap:18px;box-shadow:0 1px 3px rgba(16,19,24,.06)}
.auth-card h1{font-size:26px}
.auth-foot{text-align:center;font-size:12.5px;color:var(--muted)}
.ws{display:inline-flex;align-items:center;font-size:13px;font-weight:600;color:var(--accent-ink);background:var(--accent-soft);border-radius:999px;padding:3px 12px;justify-self:start}
.pw{position:relative}.pw .inp{padding-right:76px}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);min-height:34px;padding:0 10px;font-size:13px;border-radius:6px}
.pw button:hover{background:var(--bg)}
.btn.block{width:100%;min-height:48px;font-size:16px}
.linkbtn{border:0;background:none;color:var(--accent-ink);padding:4px 0;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.demo{width:min(420px,100%);display:grid;gap:10px}
.demo summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--ink-2);padding:6px 0;list-style-position:inside}
.demo .li{padding:10px 14px}
.umenu{position:relative}
.ubtn{gap:8px;padding:0 8px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:inline-grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.umenu .drop{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);min-width:250px;padding:6px;display:grid;z-index:45}
.umenu .me{display:grid;gap:2px;padding:8px 10px 10px;border-bottom:1px solid var(--line);margin-bottom:4px}
.umenu .drop button{border:0;background:none;text-align:left;padding:0 10px;min-height:40px;border-radius:8px}
.umenu .drop button:hover{background:var(--bg)}
#shell.noside{grid-template-columns:minmax(0,1fr)}
#shell.noside .side{display:none}
.home-grid{display:grid;gap:24px;grid-template-columns:minmax(0,1fr) 380px;align-items:start}
.home-side{position:sticky;top:calc(var(--hdr) + 16px)}
@media(max-width:1100px){.home-grid{grid-template-columns:minmax(0,1fr)}.home-side{position:static}}
.home-side .inline{grid-template-columns:minmax(0,1fr)}
.hpanel{gap:14px}
.hgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr))}
.hcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:grid}
.hcard:hover{border-color:var(--line-strong)}
.thumb{height:92px;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 14px;display:grid;grid-template-rows:auto auto 1fr;gap:5px}
.thumb .tl{display:block;height:6px;width:46%;border-radius:3px;background:var(--line-strong)}
.thumb .tl.s{width:28%;opacity:.6}
.thumb .tb{display:flex;align-items:flex-end;gap:5px;height:100%}
.thumb .tb i{flex:1;border-radius:2px 2px 0 0;opacity:.85}
.hc-body{padding:12px 14px;display:grid;gap:6px}
.hc-body b{font-weight:600}
.astrip{display:flex;gap:8px;flex-wrap:wrap}
.astrip a{display:inline-flex;align-items:baseline;gap:6px;padding:8px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink-2);text-decoration:none;font-size:14px}
.astrip a b{font-size:18px;font-variant-numeric:tabular-nums;color:var(--muted)}
.astrip a.hot{border-color:var(--busy);background:var(--busy-bg);color:var(--ink)}
.astrip a.hot b{color:var(--busy)}
.pol{display:flex;gap:10px;align-items:flex-start;padding:6px 0;cursor:pointer}
.pol>span{display:grid;gap:2px}
.pol b{font-weight:600}
.inp.lim{width:56px;min-height:32px;padding:2px 6px;font-size:14px;text-align:right;display:inline-block}
.umenu .drop.nlist{min-width:320px;max-width:min(380px,calc(100vw - 32px))}
.nlist button{display:grid!important;gap:2px;padding:8px 10px!important;min-height:auto}
.nlist button.unread span:first-child{font-weight:700}
.nlist button.unread{border-left:3px solid var(--accent);border-radius:0 8px 8px 0}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function urlState(u){
  if(u.blocked)return ['차단','b-bad'];
  if(!u.expires)return ['유효','b-ok'];
  const today=ymd(new Date());
  if(u.expires<today)return ['만료','b-idle'];

function appPicker(){

function adminGuard(title,sub){
  if(!S.user)return ph(title,sub)+needLogin('관리 화면은 로그인 후 볼 수 있습니다');
  if(!canMake()&&!['pending','rejected','approved'].includes(R.sub))return ph(title,sub)+empty('이용자 계정은 관리할 앱이 없습니다');
  if(!manageable().length&&!['pending','rejected','approved','more','skills'].includes(R.sub))return ph(title,sub)+empty('관리할 앱이 없습니다',`<a class="btn pri" href="#catalog-new">+ 새 보고서</a>`);
  return null;
}
function apprTable(status){
  const list=visibleApprovals().filter(r=>r.status===status);
  if(!list.length)return empty(status==='대기'?'처리할 승인 요청이 없습니다':'해당 내역이 없습니다');
  return `<div class="list">${list.map(r=>{const a=app(r.appId);const d=r.dataId?dataById(r.dataId):null;
    let act='';
    if(status==='대기')act=isAdmin()?`<button class="btn sm pri" data-act="approve" data-id="${r.id}">승인</button><button class="btn sm danger" data-act="reject" data-id="${r.id}">반려</button>`:`<button class="btn sm" data-act="cancelReq" data-id="${r.id}">요청 취소</button>`;
    if(status==='반려'&&!isAdmin())act=`<button class="btn sm" data-act="reRequest" data-id="${r.id}">수정 후 재요청</button>`;
    return `<div class="li"><div class="main"><span class="row"><span class="tag">${r.kind}</span><b>${esc(a?a.name:d?d.name:'삭제된 앱')}</b>${d?dataTag(r.dataId):''}${r.days?`<span class="tag pub">${r.days}일</span>`:''}</span>
    <span class="muted">사유: ${esc(r.reason)}</span>${r.rejectReason?`<span class="err">반려 사유: ${esc(r.rejectReason)}</span>`:''}
    <span class="sample">${esc(r.by)} · 요청 ${r.date}${r.decidedBy?` · ${esc(r.decidedBy)} ${r.status} ${r.decidedAt}`:''}</span></div><span class="row">${act}</span></div>`}).join('')}</div>`;
}

/* ---------- 렌더 ---------- */
function render(){
  if(S.user&&!ACC()){S.user=null;clearSession()}
  if(R.auth||!S.user){
    document.body.classList.add('pre');
    $('#auth').innerHTML=R.auth?linkView(R.auth,R.token):loginView();
    document.title=(R.auth==='invite'?'초대 수락':R.auth==='reset'?'비밀번호 재설정':'로그인')+' · Graphio VDAP';
    return;
  }
  document.body.classList.remove('pre');
  renderTop();renderSide();
  const fn=V[R.tab+'-'+R.sub]||V['home-overview'];
  $('#main').innerHTML=fn();
  document.title=`${TABS.find(t=>t.id===R.tab).label} · Graphio VDAP`;
}
function applyMode(){document.documentElement.dataset.mode=S.mode==='dark'?'dark':'light'}
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>{t.hidden=true},2800)}
function copyText(text){
  try{navigator.clipboard.writeText(text).then(()=>toast('복사했습니다'),()=>toast('복사할 수 없어요. 직접 선택해 복사해 주세요'))}catch(e){toast('복사할 수 없어요. 직접 선택해 복사해 주세요')}
}
function commit(){save();render()}

/* ---------- 빌드 진행 ---------- */
function startBuild(a,note){
  if(U())audit('배포',`${a.name} v${a.ver}`);
  a.status='building';a.progress=0;a.buildNote=note||'';delete a.log;
  ensureTicker();
}
let ticker=null;
function ensureTicker(){
  if(ticker)return;
  ticker=setInterval(()=>{
    const list=S.apps.filter(a=>a.status==='building');
    if(!list.length){clearInterval(ticker);ticker=null;return}
    list.forEach(a=>{
      a.progress=Math.min(100,(a.progress||0)+10);
      if(a.progress>=100)finishBuild(a);
    });
    save();if(document.body.classList.contains('pre')||!ACC())return;renderTop();renderSide();
    const k=R.tab+'-'+R.sub;
    if(['catalog-mine','catalog-dash','home-mine','admin-deploy','admin-urls'].includes(k))$('#main').innerHTML=V[k]();
  },650);
}
function finishBuild(a){
  delete a.progress;a.status='live';a.updated=ymd(new Date());
  S.deploys.unshift({appId:a.id,ver:a.ver,at:stamp(new Date()),by:a.owner,result:'성공',note:a.buildNote||'배포',src:a.src==='GitHub'?`GitHub ${a.branch||'main'}@${Math.random().toString(16).slice(2,9)}`:`ZIP ${a.file||a.slug+'.zip'}`});
  if(!S.urls.some(u=>u.appId===a.id&&u.type==='Private'))S.urls.push({id:uid('u'),appId:a.id,type:'Private',url:`https://${DOMAIN}/r/${a.slug}`,expires:'',views:0,blocked:false});
  if(a.wantPublic){delete a.wantPublic;S.approvals.unshift({id:uid('r'),kind:'Public URL 발급',appId:a.id,by:a.owner,reason:'등록 시 Public 공개 선택',days:30,date:ymd(new Date()),status:'대기'});notify(a.owner,`${a.name} 빌드 완료. Public URL은 관리자 승인 후 발급됩니다`,'admin-pending');notify('최관리',`${a.name} Public URL 발급 요청`,'admin-pending')}
  else notify(a.owner,`${a.name} 빌드가 끝나 Private URL이 발급되었습니다`,'catalog-mine');
  toast(`${a.name} 빌드 완료`);
}

/* ---------- 승인 처리 ---------- */
function decide(id,ok,reason){
  const r=S.approvals.find(x=>x.id===id);const a=app(r.appId);
  r.status=ok?'승인':'반려';r.decidedBy=U().name;r.decidedAt=ymd(new Date());if(!ok)r.rejectReason=reason;
  if(ok){
    if(r.kind==='앱 등록'&&a){a.status='live';if(!S.urls.some(u=>u.appId===a.id&&u.type==='Private'))S.urls.push({id:uid('u'),appId:a.id,type:'Private',url:`https://${DOMAIN}/r/${a.slug}`,expires:'',views:0,blocked:false})}
    if(r.kind==='Public URL 발급'&&a){a.vis='Public';S.urls.push({id:uid('u'),appId:a.id,type:'Public',url:`https://${DOMAIN}/p/${Math.random().toString(36).slice(2,8)}`,expires:addDays(ymd(new Date()),r.days||30),views:0,blocked:false})}
    if(r.kind==='데이터 사용'&&r.dataId){const d=dataById(r.dataId);if(d)d.access='허용'}
    if(r.kind==='데이터 연결'&&r.dataId){const d=dataById(r.dataId);if(d)d.access='허용'}
  }else{
    if(r.kind==='앱 등록'&&a)a.status='rejected';
    if((r.kind==='데이터 사용'||r.kind==='데이터 연결')&&r.dataId){const d=dataById(r.dataId);if(d)d.access='요청 필요'}
  }
  audit(r.status,`${r.kind} · ${a?a.name:(r.dataId&&dataById(r.dataId)?dataById(r.dataId).name:'')}`);
  notify(r.by,`${a?a.name:''} ${r.kind} 요청이 ${r.status}되었습니다`,ok?'admin-approved':'admin-rejected');
  toast(`${r.kind} 요청을 ${r.status}했습니다`);
}

  else if(k==='dpol'){S.dataPol[el.dataset.k]=el.checked;audit('설정','데이터 정책 변경');commit()}
  else if(k==='dpolCache'){S.dataPol.cache=el.value;audit('설정',`데이터 캐시 ${el.value}`);commit()}
  else if(k==='llmOn'){const m=S.llms.find(x=>x.id===el.dataset.id);if(!el.checked&&m.def&&S.llms.filter(x=>x.on).length<2){el.checked=true;toast('켜진 모델이 하나는 있어야 합니다');return}m.on=el.checked;m.status=m.on?(m.status==='off'?'ok':m.status):'off';if(!m.on&&m.def){m.def=false;const n=S.llms.find(x=>x.on);if(n)n.def=true}audit('설정',`LLM 관리 · ${m.name} ${m.on?'사용':'사용 중지'}`);commit()}
  else if(k==='llmDef'){S.llms.forEach(m=>m.def=m.id===el.value);const m=S.llms.find(x=>x.def);S.st.model=m.name;audit('설정',`LLM 관리 · 기본 모델 ${m.name}`);commit();toast(`Studio 기본 모델을 ${m.name}로 바꿨습니다`)}
  else if(k==='llmLimit'){const v=Math.max(1,parseInt(el.value)||1);S.llmDept[+el.dataset.i][2]=v;audit('설정',`LLM 관리 · ${S.llmDept[+el.dataset.i][0]} 월 한도 ${v}M`);commit()}
  else if(k==='llmPol'){S.llmPol[el.dataset.k]=el.checked;audit('설정','LLM 프롬프트 정책 변경');commit()}
  else if(k==='llmPolSel'){S.llmPol[el.dataset.k]=el.value;audit('설정','LLM 프롬프트 정책 변경');commit()}
  else if(k==='gitAuto'){const a=app(el.dataset.id);a.auto=el.checked;audit('설정',`GitLab 관리 · ${a.name} 자동 배포 ${a.auto?'켬':'끔'}`);commit()}
  else if(k==='gitPol'){S.gitPol[el.dataset.k]=el.checked;audit('설정','Git 정책 변경');commit()}
  else if(k==='gitHosts'){S.gitPol.hosts=el.value;save();toast('허용 호스트를 저장했습니다')}
  else if(k==='gitBranch'){S.gitPol.branch=el.value.trim()||'main';save();toast('기본 브랜치를 저장했습니다')}
  else if(k==='accRole'){const a=acc(el.dataset.id);if(a.role==='admin'&&el.value!=='admin'&&S.accounts.filter(x=>x.role==='admin'&&x.status==='active').length<2){el.value='admin';toast('마지막 관리자의 역할은 바꿀 수 없습니다');return}a.role=el.value;audit('계정',`${a.name} 역할 ${ROLE_LABEL[a.role]}`);commit();toast(`${a.name}님 역할을 ${ROLE_LABEL[a.role]}로 바꿨습니다`)}
  else if(k==='role'){S.perm[S.appSel][+el.dataset.i].role=el.value;save();toast('역할을 바꿨습니다')}
  else if(k==='stModel'){S.st.model=el.value;commit()}
  else if(k==='stOut'){S.st.out=el.value;commit()}
  else if(k==='stDept'){S.st.dept=el.value;commit()}
  else if(k==='stSkill'){const id=el.value;S.st.skills=el.checked?S.st.skills.concat(id):S.st.skills.filter(x=>x!==id);commit()}
  else if(k==='skOn'){const sk=skillById(el.dataset.id);sk.on=el.checked;if(!sk.on)S.st.skills=S.st.skills.filter(x=>x!==sk.id);commit();toast(sk.on?'Studio에서 쓸 수 있습니다':'Studio 선택 목록에서 뺐습니다')}
  else if(k==='skBase'){if(!isAdmin()){el.checked=!el.checked;toast('기본 적용은 관리자만 바꿉니다');return}skillById(el.dataset.id).base=el.checked;commit()}
  else if(el.id==='nf-file'){nfFile(el.files[0])}
  else if(el.id==='sk-up'){const f=el.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{addSkill({file:f.name,body:String(rd.result),size:fsize(f.size)});commit();toast('스킬 파일을 올렸습니다')};rd.readAsText(f)}

  else if(el.id==='cat-status'){S.catStatus=el.value;commit()}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.nf){NF[t.dataset.nf]=t.value;const b=$('#nf-submit');if(b)b.disabled=!nfReady();return}
  if(t.dataset.nfenv){NF.env[+t.dataset.i][t.dataset.nfenv]=t.value;return}
  if(t.id==='sk-q'){S.skQ=t.value;clearTimeout(window._sq);window._sq=setTimeout(()=>{render();const q=$('#sk-q');if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}},250);return}
  if(t.id==='st-prompt'){S.st.prompt=t.value;clearTimeout(window._pt);window._pt=setTimeout(save,400);return}
  if(e.target.id==='cat-q'){S.catQ=e.target.value;save();clearTimeout(window._qt);window._qt=setTimeout(()=>{const pos=e.target.selectionStart;render();const q=$('#cat-q');if(q){q.focus();try{q.setSelectionRange(pos,pos)}catch(_){}}},250)}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&M)closeModal()});
document.addEventListener('dragover',e=>{const d=e.target.closest&&e.target.closest('#nf-drop');if(d){e.preventDefault();d.classList.add('over')}});
document.addEventListener('dragleave',e=>{const d=e.target.closest&&e.target.closest('#nf-drop');if(d)d.classList.remove('over')});
document.addEventListener('drop',e=>{const d=e.target.closest&&e.target.closest('#nf-drop');if(d){e.preventDefault();nfFile(e.dataTransfer.files[0])}});
window.addEventListener('hashchange',()=>{R=parseHash();closeModal();render();window.scrollTo(0,0)});

const hdrRO=new ResizeObserver(()=>{document.documentElement.style.setProperty('--hdr',$('#top').offsetHeight+'px')});
hdrRO.observe($('#top'));

if(!S.mode){let dark=false;try{dark=document.documentElement.dataset.theme==='dark'||(!document.documentElement.dataset.theme&&matchMedia('(prefers-color-scheme: dark)').matches)}catch(e){}S.mode=dark?'dark':'light'}
applyMode();
R=parseHash();
render();
if(S.apps.some(a=>a.status==='building'))ensureTicker();
}
</script>
</body>
</html>
